<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Colorful poster</title>
  </head>
  
  <style>
    
    body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
    }
    
    h1, h2, h3 {
      text-transform: uppercase;
      font-size: 150px;
      font-weight: 900;
      position: absolute;
      left: 110px;
      color: white;
      font-family: 'Arial Black';
      margin: 0;
      overflow: hidden;
      z-index: 1;
      line-height: 0.86;
    }
    
   h1 {
      top: 110px;
     z-index: 3;
    }
    h2 {
      top: 280px;
      z-index: 1;
    }
    h3 {
      top: 460px;
      z-index: 3;
    }
    
    .poster{
      position: relative;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background-color: hsl(0, 0%, 16%);
    }
    
    .poster::after{
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      background-image: 
        linear-gradient(to right, white 1px, transparent 1px),
        linear-gradient(to bottom, white 1px, transparent 1px);
      background-size: 25% 25%;
      background-repeat: repeat;
    }
    
    .model img{
      position: absolute;
      width: 690px;
      left: 210px;
      top: 155px;
      z-index: 2;
    }
    
    .o {
      position: absolute;
      top: 450px;
      left: 235px;
      width: 160px;
      z-index: 4;
    }
    
    .sphere {
      position: absolute;
      top: 190px;
      left: 345px;
      width: 140px;
      z-index: 4;
    }
  
  </style>
  
  <body>
   <section class="poster">
      <h1> COLO </h1>
      <h2> RF </h2> 
      <h3> MODE </h3>
      <div class="model"> <img src="https://static.vecteezy.com/system/resources/thumbnails/056/749/916/small/wonderful-minimalist-colorful-3d-geometric-shapes-abstract-background-detailed-png.png" alt="abstract 3d model">
     </div>
    <img class="o" src="https://cdn3d.iconscout.com/3d/premium/thumb/abstract-sphere-shape-3d-icon-png-download-9645996.png" alt="Abstract sphere">
     <img class="sphere" src="https://cdn3d.iconscout.com/3d/premium/thumb/abstract-sphere-shape-3d-icon-png-download-9645996.png" alt="Abstract sphere">
    </section>
  </body>
</html>
